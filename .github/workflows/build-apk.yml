name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar Release em tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (17/09/2026): historico completo + tags, necessario pro passo "Monta
      # changelog resumido" abaixo comparar contra a tag da release anterior (git describe/git
      # log precisam do historico inteiro - o checkout raso padrao (so o ultimo commit) nao
      # tem as tags anteriores pra comparar).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android@v3 removido (17/09/2026): o passo interno dele tenta
      # baixar o pacote legado "tools" via sdkmanager, que a Google removeu do repositorio do
      # SDK - falha sempre com "Warning: Failed to find package 'tools'" / exit code 1, antes
      # mesmo de chegar no build de verdade (quebrou silenciosamente TODO push na master desde
      # pelo menos 16/09/2026, sem nenhum Release novo sair - so descoberto ao investigar por
      # que a auto-atualizacao in-app nao tinha nada novo pra oferecer). O runner ubuntu-latest
      # do GitHub ja vem com Android SDK pre-instalado em /usr/local/lib/android/sdk
      # (ANDROID_HOME/ANDROID_SDK_ROOT ja setados certos pelo runner), so o sdkmanager em si
      # nao fica no PATH por padrao. Confirmado por diagnostico ao vivo (17/09/2026): o
      # binario real fica em cmdline-tools/latest/bin/sdkmanager (3 niveis abaixo de
      # cmdline-tools) - maxdepth 4 da folga suficiente sem precisar varrer o sistema
      # inteiro (find / sem limite, usado so no diagnostico, levou 5+ minutos).
      - name: Aponta pro Android SDK ja pre-instalado no runner
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -name sdkmanager 2>/dev/null | head -n1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "::error::sdkmanager nao encontrado em $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          dirname "$SDKMANAGER_PATH" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # ndk;26.1.10909125 e cmake;3.22.1 removidos daqui (17/09/2026): o app nao compila mais
      # nenhum codigo nativo via CMake/NDK desde que a sintese de voz local (sherpa-onnx/
      # llama.cpp) foi removida em 16/09/2026 (ADR-035) - confirmado sem
      # externalNativeBuild/CMakeLists em app/build.gradle.kts e sem nenhum .so/jniLibs no
      # projeto. O `ndk { abiFilters += "arm64-v8a" }` que ainda existe em build.gradle.kts e
      # so um filtro de empacotamento pra .so vindo de dependencias (ExoPlayer etc.), nao pede
      # o SDK component do NDK. Baixar ~1GB de NDK + CMake em toda rodada de CI, sem nenhum uso,
      # era o motivo real do build ficar lento - nao "so no primeiro", TODO run (GitHub Actions
      # roda numa VM nova sempre, nada fica em cache exceto o que actions/cache guarda
      # explicitamente).
      - name: Instala plataforma e build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Gera local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # Calculada ANTES do build (nao so depois, como antes) pra poder embutir a MESMA tag no
      # APK via BuildConfig.RELEASE_TAG (ver app/build.gradle.kts e UpdateCheckRepository) - e o
      # que o app compara contra a ultima release do GitHub pra saber se tem atualizacao. Tag
      # manual (git tag v0.1.0) usa o proprio nome da tag; qualquer outro caso (push/dispatch na
      # master) usa data + numero do run, igual sempre foi.
      - name: Calcula tag da build
        id: ver
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(date -u +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      # Changelog resumido pro popup de atualizacao in-app (pedido do usuario 17/09/2026): um
      # bullet por commit desde a ultima release publicada nesse branch, usando so a PRIMEIRA
      # linha da mensagem (o titulo/resumo - nunca o corpo detalhado, tecnico demais pra quem so
      # quer ver "o que mudou"). git describe acha a tag alcancavel mais proxima do commit PAI
      # (HEAD^, nao HEAD - a tag desta propria build ainda nao existe nesse ponto do workflow);
      # sem tag nenhuma ainda (primeira release do repo), cai pros ultimos 20 commits. --no-merges
      # pra nao poluir com "Merge branch..." em PRs mergeadas. UpdateCheckRepository.kt le esse
      # texto direto do campo "body" da release via API do GitHub - nenhuma mudanca no app
      # depende do FORMATO exato aqui alem de "texto simples com uma linha por novidade".
      - name: Monta changelog resumido (bullets desde a release anterior)
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:'- %s' --no-merges)
          else
            LOG=$(git log --pretty=format:'- %s' --no-merges -20)
          fi
          if [ -z "$LOG" ]; then
            LOG="- Build automática do merge ${{ github.sha }} na master."
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # So fora de pull_request - a chave de release real nunca fica exposta num build de PR
      # (nem de fork nem de branch do proprio repo). Builds de PR continuam saindo com a
      # assinatura de debug, igual sempre foi (ver app/build.gradle.kts).
      - name: Materializa a keystore de release
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.event_name != 'pull_request' && format('{0}/release.jks', github.workspace) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEYSTORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.RELEASE_KEY_PASSWORD || '' }}
          APP_RELEASE_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Remove a keystore temporaria
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/release.jks"

      - name: Renomeia APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PailerFM.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PailerFM-apk
          path: dist/PailerFM.apk
          retention-days: 30

      # Merge na master: cria uma tag imutável por data + nº do run e um Release com o APK.
      - name: Publica Release automático (merge na master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PailerFM.apk
          fail_on_unmatched_files: true
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PailerFM ${{ steps.ver.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          prerelease: true

      # Tag manual v* (ex.: git tag v0.1.0): Release "de verdade", não prerelease.
      - name: Publica Release (tag manual v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PailerFM.apk
          fail_on_unmatched_files: true
