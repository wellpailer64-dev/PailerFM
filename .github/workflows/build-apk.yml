name: Build APK

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar Release em tag

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Instala NDK e CMake pinados
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Gera local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # Se os secrets de assinatura estao configurados, materializa a chave de release
      # (pailer-release.jks) + keystore.properties, que app/build.gradle.kts detecta pra
      # assinar a release com a chave dedicada em vez da chave de debug. Sem os secrets
      # (ex.: PR de fork), o APK sai assinado com a chave de debug, como antes.
      - name: Configura assinatura de release (se secrets presentes)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::notice::Sem RELEASE_KEYSTORE_BASE64 - APK sai assinado com a chave de debug."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > pailer-release.jks
          {
            echo "storeFile=pailer-release.jks"
            echo "storePassword=$RELEASE_KEYSTORE_PASSWORD"
            echo "keyAlias=$RELEASE_KEY_ALIAS"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties
          echo "::notice::keystore.properties criado - APK sera assinado com a chave de release."

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Remove keystore do runner
        if: always()
        run: rm -f pailer-release.jks keystore.properties

      - name: Mostra qual chave assinou o APK
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | grep -E "Signer #1 certificate (DN|SHA-256)" || true

      - name: Renomeia APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/PailerFM.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PailerFM-apk
          path: dist/PailerFM.apk
          retention-days: 30

      - name: Calcula tag por data
        id: ver
        run: echo "tag=v$(date -u +'%Y.%m.%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Merge na master: cria uma tag imutável por data + nº do run e um Release com o APK.
      - name: Publica Release automático (merge na master)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PailerFM.apk
          fail_on_unmatched_files: true
          tag_name: ${{ steps.ver.outputs.tag }}
          name: PailerFM ${{ steps.ver.outputs.tag }}
          body: |
            Build automática do merge ${{ github.sha }} na master.
          prerelease: true

      # Tag manual v* (ex.: git tag v0.1.0): Release "de verdade", não prerelease.
      - name: Publica Release (tag manual v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PailerFM.apk
          fail_on_unmatched_files: true
